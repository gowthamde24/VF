<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nutrient Dosing Pumps Array Schematic</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Courier+Prime:ital,wght@0,400;0,700;1,400&family=Inter:wght@400;600;700&display=swap');

        body {
            background-color: #e5e7eb;
            font-family: 'Inter', sans-serif;
            color: #000000;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 2rem;
        }
        
        .paper {
            background-color: #ffffff;
            border: 1px solid #d1d5db;
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1), 0 4px 6px -2px rgba(0, 0, 0, 0.05);
        }

        /* Custom SVG styling */
        svg text {
            font-family: 'Courier Prime', monospace;
            font-size: 14px;
            fill: #000000;
        }

        .diagram-box {
            fill: #ffffff;
            stroke: #000000;
            stroke-width: 2.5;
        }

        .logic-box {
            fill: #ffffff;
            stroke: #000000;
            stroke-width: 2;
            stroke-dasharray: 6 4;
        }

        .signal-line {
            fill: none;
            stroke: #000000;
            stroke-width: 2;
            stroke-dasharray: 4 4;
        }

        /* Tri-layered tube styling for the "hollow dashed" look */
        .tube-outline {
            fill: none;
            stroke: #000000;
            stroke-width: 8;
        }
        .tube-inner {
            fill: none;
            stroke: #ffffff;
            stroke-width: 5;
        }
        .tube-dash {
            fill: none;
            stroke: #000000;
            stroke-width: 2;
            stroke-dasharray: 5 4;
        }

        .water-level {
            stroke: #000000;
            stroke-width: 2;
            stroke-dasharray: 8 6;
            fill: none;
        }
        
        .droplet {
            fill: #000000;
        }

        .dotted-line {
            stroke: #000000;
            stroke-width: 1.5;
            stroke-dasharray: 2 4;
            stroke-linecap: round;
        }
        
        .mixing-current {
            fill: none;
            stroke: #64748b;
            stroke-width: 1.5;
            stroke-linecap: round;
        }
    </style>
</head>
<body>

    <div class="paper max-w-[900px] w-full p-6 relative">
        
        <!-- Schematic Diagram -->
        <div class="w-full overflow-hidden bg-white border-2 border-black p-2">
            <svg viewBox="0 0 800 750" class="w-full h-auto bg-[#f8fafc]">
                
                <!-- Grid Background -->
                <defs>
                    <pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse">
                        <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#f1f5f9" stroke-width="1"/>
                    </pattern>
                    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
                        <polygon points="0 0, 10 3.5, 0 7" fill="#000" />
                    </marker>
                    <marker id="signal-arrow" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
                        <polygon points="0 0, 10 3.5, 0 7" fill="#000" />
                    </marker>
                </defs>
                <rect x="0" y="0" width="800" height="750" fill="url(#grid)" />


                <!-- ========================================== -->
                <!-- TUBING (Drawn first so it sits behind)     -->
                <!-- ========================================== -->

                <!-- Tube 3 (Left - Nutrient A) -->
                <path d="M 200 180 L 200 515" class="tube-outline" />
                <path d="M 200 180 L 200 515" class="tube-inner" />
                <path d="M 200 180 L 200 515" class="tube-dash" />

                <!-- Tube 4 (Right - Nutrient B) -->
                <path d="M 600 180 L 600 515" class="tube-outline" />
                <path d="M 600 180 L 600 515" class="tube-inner" />
                <path d="M 600 180 L 600 515" class="tube-dash" />


                <!-- ========================================== -->
                <!-- TOP RESERVOIRS                             -->
                <!-- ========================================== -->

                <!-- Chemical Reservoir 3 (Nutrient A) -->
                <rect x="180" y="35" width="40" height="15" fill="#ffffff" stroke="#000" stroke-width="2" />
                <rect x="100" y="50" width="200" height="130" class="diagram-box" />
                
                <text x="200" y="85" text-anchor="middle" font-weight="bold">NUTRIENT A</text>
                <text x="200" y="110" text-anchor="middle">Nitrogen-Heavy</text>
                <!-- Fluid level dashed line -->
                <line x1="102" y1="125" x2="298" y2="125" stroke="#000" stroke-dasharray="5 3" />
                <text x="200" y="145" text-anchor="middle" font-style="italic">(Macro-Nutrients)</text>

                <!-- Chemical Reservoir 4 (Nutrient B) -->
                <rect x="580" y="35" width="40" height="15" fill="#ffffff" stroke="#000" stroke-width="2" />
                <rect x="500" y="50" width="200" height="130" class="diagram-box" />
                
                <text x="600" y="85" text-anchor="middle" font-weight="bold">NUTRIENT B</text>
                <text x="600" y="110" text-anchor="middle">Phosphorus/Potassium</text>
                <!-- Fluid level dashed line -->
                <line x1="502" y1="125" x2="698" y2="125" stroke="#000" stroke-dasharray="5 3" />
                <text x="600" y="145" text-anchor="middle" font-style="italic">(Macro-Nutrients)</text>


                <!-- ========================================== -->
                <!-- PUMP 3 (LEFT)                              -->
                <!-- ========================================== -->
                
                <!-- Pump Body -->
                <rect x="145" y="250" width="110" height="110" fill="#1e293b" rx="12" />
                <circle cx="200" cy="305" r="45" fill="#ffffff" stroke="#000" stroke-width="2" />
                
                <!-- Tubing Arc inside Pump -->
                <path d="M 165 305 A 35 35 0 0 0 235 305" fill="none" stroke="#1f2937" stroke-width="10" />
                
                <!-- Rotor & Center -->
                <polygon points="195,285 205,285 220,305 205,325 195,325 180,305" fill="#334155" transform="rotate(30 200 305)" />
                <circle cx="200" cy="305" r="12" fill="#000" />
                
                <!-- Rollers -->
                <circle cx="200" cy="275" r="9" fill="#94a3b8" stroke="#000" stroke-width="1.5" />
                <circle cx="226" cy="320" r="9" fill="#94a3b8" stroke="#000" stroke-width="1.5" />
                <circle cx="174" cy="320" r="9" fill="#94a3b8" stroke="#000" stroke-width="1.5" />

                <!-- Text Background Mask (Prevents tube overlap) -->
                <rect x="135" y="375" width="130" height="20" fill="#f8fafc" />
                <text x="200" y="390" text-anchor="middle" font-weight="bold">Pump 3 (Nutrient A)</text>


                <!-- ========================================== -->
                <!-- PUMP 4 (RIGHT)                             -->
                <!-- ========================================== -->
                
                <!-- Pump Body -->
                <rect x="545" y="250" width="110" height="110" fill="#1e293b" rx="12" />
                <circle cx="600" cy="305" r="45" fill="#ffffff" stroke="#000" stroke-width="2" />
                
                <!-- Tubing Arc inside Pump -->
                <path d="M 565 305 A 35 35 0 0 0 635 305" fill="none" stroke="#1f2937" stroke-width="10" />
                
                <!-- Rotor & Center -->
                <polygon points="595,285 605,285 620,305 605,325 595,325 580,305" fill="#334155" transform="rotate(15 600 305)" />
                <circle cx="600" cy="305" r="12" fill="#000" />
                
                <!-- Rollers -->
                <circle cx="610" cy="276" r="9" fill="#94a3b8" stroke="#000" stroke-width="1.5" />
                <circle cx="622" cy="323" r="9" fill="#94a3b8" stroke="#000" stroke-width="1.5" />
                <circle cx="573" cy="312" r="9" fill="#94a3b8" stroke="#000" stroke-width="1.5" />

                <!-- Text Background Mask (Prevents tube overlap) -->
                <rect x="535" y="375" width="130" height="20" fill="#f8fafc" />
                <text x="600" y="390" text-anchor="middle" font-weight="bold">Pump 4 (Nutrient B)</text>


                <!-- ========================================== -->
                <!-- ELECTRONIC INTERLOCK LOGIC                 -->
                <!-- ========================================== -->
                
                <!-- Electronic Signals (Drawn behind the logic box) -->
                <line x1="280" y1="305" x2="260" y2="305" class="signal-line" marker-end="url(#signal-arrow)" />
                <line x1="520" y1="305" x2="540" y2="305" class="signal-line" marker-end="url(#signal-arrow)" />

                <!-- The Logic Box -->
                <rect x="280" y="270" width="240" height="75" class="logic-box" />
                <rect x="282" y="272" width="236" height="25" fill="#1f2937" />
                
                <text x="400" y="289" text-anchor="middle" font-weight="bold" fill="#ffffff" font-size="12">ELECTRONIC INTERLOCK</text>
                
                <text x="400" y="318" text-anchor="middle" font-size="12">Main Irrigation Pump</text>
                <text x="400" y="335" text-anchor="middle" font-weight="bold" font-size="12">MUST BE RUNNING (ON)</text>


                <!-- ========================================== -->
                <!-- DROPLETS & VOLUME TEXT                     -->
                <!-- ========================================== -->
                
                <!-- Droplet 1 -->
                <path d="M 200 505 C 190 520, 190 530, 200 535 C 210 530, 210 520, 200 505 Z" class="droplet" />
                <line x1="225" y1="520" x2="275" y2="520" class="dotted-line" />
                
                <rect x="280" y="505" width="160" height="20" fill="#f8fafc" />
                <text x="280" y="525" text-anchor="start" font-weight="bold">Q_p ≈ 1.66 mL/min</text>

                <!-- Droplet 2 -->
                <path d="M 600 505 C 590 520, 590 530, 600 535 C 610 530, 610 520, 600 505 Z" class="droplet" />
                <line x1="575" y1="520" x2="525" y2="520" class="dotted-line" />
                
                <rect x="360" y="505" width="160" height="20" fill="#f8fafc" />
                <text x="520" y="525" text-anchor="end" font-weight="bold">Q_p ≈ 1.66 mL/min</text>


                <!-- ========================================== -->
                <!-- BOTTOM RESERVOIR & MIXING ZONE             -->
                <!-- ========================================== -->

                <!-- Water Fill -->
                <path d="M 102 590 Q 250 570, 400 590 T 698 590 L 698 718 L 102 718 Z" fill="#eff6ff" />
                
                <rect x="100" y="550" width="600" height="170" class="diagram-box" fill="none" />
                
                <!-- Wavy dashed water level -->
                <path d="M 100 590 Q 250 570, 400 590 T 700 590" class="water-level" />
                
                <!-- Mixing Currents / Turbulence Visualization -->
                <path d="M 200 550 C 230 580, 240 610, 200 630" class="mixing-current" marker-end="url(#arrowhead)" />
                <path d="M 190 560 C 160 590, 150 620, 180 640" class="mixing-current" marker-end="url(#arrowhead)" />
                
                <path d="M 600 550 C 570 580, 560 610, 600 630" class="mixing-current" marker-end="url(#arrowhead)" />
                <path d="M 610 560 C 640 590, 650 620, 620 640" class="mixing-current" marker-end="url(#arrowhead)" />
                
                <path d="M 360 650 C 350 600, 450 600, 440 650 C 430 700, 370 700, 360 660" class="mixing-current" stroke-dasharray="4 4" marker-end="url(#arrowhead)" />

                <!-- Reservoir Texts -->
                <rect x="250" y="655" width="300" height="50" fill="#ffffff" stroke="#000" stroke-width="1.5" />
                <text x="400" y="675" text-anchor="middle" font-weight="bold" font-size="16">50L Nutrient Reservoir</text>
                <text x="400" y="695" text-anchor="middle" font-weight="bold" font-size="12">Active Mixing Zone (No Root Burn)</text>

            </svg>
        </div>

    </div>

</body>
</html>
