<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Centrifugal Pump Schematic</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Courier+Prime:ital,wght@0,400;0,700;1,400&family=Inter:wght@400;600;700&display=swap');

        body {
            background-color: #e5e7eb;
            font-family: 'Inter', sans-serif;
            color: #000000;
        }
        
        .paper {
            background-color: #ffffff;
            border: 1px solid #d1d5db;
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1), 0 4px 6px -2px rgba(0, 0, 0, 0.05);
        }

        /* Custom SVG styling */
        svg text {
            font-family: 'Courier Prime', monospace;
            font-size: 14px;
            fill: #000000;
        }

        .diagram-box {
            fill: #ffffff;
            stroke: #000000;
            stroke-width: 2.5;
        }

        /* Segmented Pipe Style */
        .pipe-base {
            fill: none;
            stroke: #1f2937;
            stroke-width: 16;
            stroke-linecap: square;
        }
        .pipe-segments {
            fill: none;
            stroke: #ffffff;
            stroke-width: 16;
            stroke-dasharray: 2 12;
        }

        .water-level {
            stroke: #000000;
            stroke-width: 2;
            stroke-dasharray: 10 5;
            fill: none;
        }

        .dimension-line {
            stroke: #000000;
            stroke-width: 1.5;
        }

        .return-line {
            stroke: #000000;
            stroke-width: 2.5;
            stroke-dasharray: 8 6;
        }
    </style>
</head>
<body class="min-h-screen py-10 px-4 flex justify-center items-center">

    <div class="paper max-w-[900px] w-full p-8 relative">
        
        <!-- Graph SVG (Strictly the diagram, no math section) -->
        <div class="w-full overflow-hidden bg-white border-2 border-black p-2">
            <svg viewBox="0 0 750 650" class="w-full h-auto bg-[#f8fafc]">
                
                <!-- Grid Background -->
                <defs>
                    <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse">
                        <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#e2e8f0" stroke-width="1"/>
                    </pattern>
                    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
                        <polygon points="0 0, 10 3.5, 0 7" fill="#000" />
                    </marker>
                    <marker id="arrowhead-reverse" markerWidth="10" markerHeight="7" refX="1" refY="3.5" orient="auto">
                        <polygon points="10 0, 0 3.5, 10 7" fill="#000" />
                    </marker>
                </defs>
                <rect x="0" y="0" width="750" height="650" fill="url(#grid)" />

                <!-- ========================================== -->
                <!-- PIPING (Drawn first so boxes sit on top)   -->
                <!-- ========================================== -->

                <!-- Intake Pipe -->
                <path d="M 300 530 L 440 530" class="pipe-base" />
                <path d="M 300 530 L 440 530" class="pipe-segments" />
                
                <!-- Discharge Pipe (Vertical Lift & Horizontal) -->
                <path d="M 440 480 L 440 90 L 320 90" class="pipe-base" stroke-linejoin="miter" />
                <path d="M 440 480 L 440 90 L 320 90" class="pipe-segments" />

                <!-- Flow Direction Arrows Overlay -->
                <!-- Intake Arrow -->
                <polygon points="360,520 360,540 380,530" fill="#000" />
                <!-- Vertical Lift Arrow -->
                <polygon points="430,310 450,310 440,285" fill="#000" />
                <!-- Top Horizontal Arrow -->
                <polygon points="360,80 360,100 335,90" fill="#000" />


                <!-- ========================================== -->
                <!-- RETURN LINES & AGITATION                   -->
                <!-- ========================================== -->
                <path d="M 140 130 L 140 470" class="return-line" />
                <path d="M 220 130 L 220 470" class="return-line" />
                
                <!-- Splash Arcs -->
                <path d="M 125 470 Q 140 440, 155 470" fill="none" stroke="#000" stroke-width="2" />
                <path d="M 205 470 Q 220 440, 235 470" fill="none" stroke="#000" stroke-width="2" />


                <!-- ========================================== -->
                <!-- MAIN COMPONENTS & BOXES                    -->
                <!-- ========================================== -->

                <!-- 50L Nutrient Reservoir -->
                <rect x="60" y="440" width="280" height="150" class="diagram-box" fill="#eff6ff" />
                <!-- Water Level Dashed Line -->
                <path d="M 60 480 Q 130 490, 200 480 T 340 480" class="water-level" />
                
                <text x="200" y="540" text-anchor="middle" font-weight="bold" font-size="16">50L Nutrient</text>
                <text x="200" y="565" text-anchor="middle" font-weight="bold" font-size="16">Reservoir</text>

                <!-- Grow Towers Box -->
                <rect x="80" y="50" width="250" height="80" class="diagram-box" />
                <text x="205" y="80" text-anchor="middle" font-weight="bold" font-size="15">Vertical Grow Towers</text>
                <text x="205" y="105" text-anchor="middle" font-style="italic">Polyculture Area</text>

                <!-- 12V Centrifugal Pump -->
                <!-- Motor Block -->
                <rect x="460" y="485" width="85" height="65" fill="#1f2937" rx="6" />
                <line x1="475" y1="485" x2="475" y2="550" stroke="#4b5563" stroke-width="3" />
                <line x1="490" y1="485" x2="490" y2="550" stroke="#4b5563" stroke-width="3" />
                <line x1="505" y1="485" x2="505" y2="550" stroke="#4b5563" stroke-width="3" />
                <line x1="520" y1="485" x2="520" y2="550" stroke="#4b5563" stroke-width="3" />
                <!-- Volute (Pump Head) -->
                <circle cx="440" cy="515" r="35" fill="#374151" stroke="#000" stroke-width="2.5" />
                <circle cx="440" cy="515" r="12" fill="#111827" />
                
                <!-- Pump Text (Safe placement below pump) -->
                <text x="485" y="585" text-anchor="middle" font-weight="bold">12V Centrifugal</text>
                <text x="485" y="605" text-anchor="middle" font-weight="bold">Irrigation Pump</text>


                <!-- ========================================== -->
                <!-- ANNOTATION BOXES                           -->
                <!-- ========================================== -->

                <!-- Surface Agitation Box -->
                <rect x="65" y="270" width="230" height="65" class="diagram-box" />
                <text x="180" y="300" text-anchor="middle" font-weight="bold">Surface Agitation</text>
                <text x="180" y="320" text-anchor="middle">DO > 6.0 mg/L</text>

                <!-- Volumetric Flow Label (Q) (Overlaid on vertical pipe) -->
                <rect x="350" y="150" width="180" height="45" class="diagram-box" />
                <text x="440" y="178" text-anchor="middle" font-weight="bold">Q ≈ 4.5 L/min</text>


                <!-- ========================================== -->
                <!-- DIMENSION LINES (HEAD H)                   -->
                <!-- ========================================== -->
                
                <!-- Top Extension Line -->
                <line x1="450" y1="90" x2="650" y2="90" stroke="#000" stroke-width="1.5" stroke-dasharray="6 4" />
                <!-- Bottom Extension Line (Aligns with water level) -->
                <line x1="350" y1="480" x2="650" y2="480" stroke="#000" stroke-width="1.5" stroke-dasharray="6 4" />
                
                <!-- Vertical Dimension Line -->
                <line x1="620" y1="90" x2="620" y2="480" class="dimension-line" marker-start="url(#arrowhead-reverse)" marker-end="url(#arrowhead)" />
                
                <!-- Head (H) Box -->
                <rect x="550" y="250" width="140" height="65" class="diagram-box" />
                <text x="620" y="280" text-anchor="middle" font-weight="bold" font-size="15">Head (H)</text>
                <text x="620" y="300" text-anchor="middle" font-weight="bold">1.2 Meters</text>

            </svg>
        </div>

    </div>

</body>
</html>
