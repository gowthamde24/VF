<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Power Architecture & Isolation Schematic</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Courier+Prime:ital,wght@0,400;0,700;1,400&family=Inter:wght@400;600;700&display=swap');

        body {
            background-color: #e5e7eb;
            font-family: 'Inter', sans-serif;
            color: #000000;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 1rem;
        }
        
        .paper {
            background-color: #ffffff;
            border: 1px solid #d1d5db;
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1), 0 4px 6px -2px rgba(0, 0, 0, 0.05);
            width: 100%;
            max-width: 1000px;
        }

        /* Custom SVG styling */
        svg text {
            font-family: 'Courier Prime', monospace;
            font-size: 13px;
            fill: #000000;
        }

        .wire {
            fill: none;
            stroke: #000000;
            stroke-width: 2;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        .wire-dot {
            fill: #000000;
        }

        .isolation-barrier {
            stroke: #000000;
            stroke-width: 3;
            stroke-dasharray: 10 6;
            fill: none;
        }

        .component-box {
            fill: #ffffff;
            stroke: #000000;
            stroke-width: 2.5;
        }

        .ground-symbol {
            stroke: #000;
            stroke-width: 2;
        }

        .opto-beam {
            stroke: #000;
            stroke-width: 1.5;
            stroke-dasharray: 2 2;
        }

        .text-mask {
            fill: #ffffff;
        }
    </style>
</head>
<body>

    <div class="paper">
        <!-- Increased viewBox height to 800 to prevent bottom overlap -->
        <div class="w-full overflow-hidden bg-white border-2 border-black p-4">
            <svg viewBox="0 0 1000 800" class="w-full h-auto bg-[#f8fafc]">
                
                <!-- Grid Background -->
                <defs>
                    <pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse">
                        <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#f1f5f9" stroke-width="1"/>
                    </pattern>
                    <marker id="arrow" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
                        <polygon points="0 0, 10 3.5, 0 7" fill="#000" />
                    </marker>
                </defs>
                <rect x="0" y="0" width="1000" height="800" fill="url(#grid)" />

                <!-- ========================================== -->
                <!-- ISOLATION BARRIER                          -->
                <!-- ========================================== -->
                <path d="M 500 40 L 500 680" class="isolation-barrier" />
                
                <rect x="415" y="45" width="170" height="35" class="component-box" />
                <text x="500" y="68" text-anchor="middle" font-weight="bold" font-size="16">GALVANIC GAP</text>

                <!-- Domain Labels -->
                <text x="250" y="70" text-anchor="middle" font-weight="bold" font-size="18">5.1V LOGIC DOMAIN</text>
                <text x="750" y="70" text-anchor="middle" font-weight="bold" font-size="18">12V ACTUATION DOMAIN</text>


                <!-- ========================================== -->
                <!-- POWER ARCHITECTURE                         -->
                <!-- ========================================== -->
                
                <!-- 12V Main Input -->
                <line x1="900" y1="120" x2="650" y2="120" class="wire" marker-end="url(#arrow)" />
                <rect x="850" y="105" width="130" height="30" class="text-mask" fill-opacity="0.9"/>
                <text x="910" y="125" font-weight="bold">12V DC IN</text>
                
                <!-- Buck Converter -->
                <rect x="530" y="150" width="160" height="90" class="component-box" />
                <text x="610" y="175" text-anchor="middle" font-weight="bold">BUCK CONVERTER</text>
                <text x="610" y="195" text-anchor="middle" font-size="11">Efficiency: &eta; &approx; 92%</text>
                <text x="610" y="215" text-anchor="middle" font-size="11">(Switching Regulator)</text>

                <!-- Power Routing -->
                <polyline points="820,120 820,195 690,195" class="wire" />
                <circle cx="820" cy="120" r="4" class="wire-dot" />
                
                <polyline points="530,195 260,195 260,250" class="wire" marker-end="url(#arrow)" />
                <rect x="300" y="180" width="120" height="20" class="text-mask" />
                <text x="360" y="195" text-anchor="middle" font-weight="bold">5.1V DC Output</text>


                <!-- ========================================== -->
                <!-- LOGIC SIDE COMPONENTS                      -->
                <!-- ========================================== -->
                
                <rect x="100" y="250" width="200" height="300" class="component-box" />
                <text x="200" y="280" text-anchor="middle" font-weight="bold" font-size="16">RASPBERRY PI 4</text>
                
                <rect x="250" y="320" width="50" height="30" class="component-box" />
                <text x="240" y="340" text-anchor="end" font-weight="bold">GPIO_17</text>
                
                <rect x="110" y="500" width="130" height="70" class="component-box" />
                <text x="175" y="525" text-anchor="middle" font-weight="bold">ADS1115 ADC</text>
                <text x="175" y="545" text-anchor="middle" font-size="11">I2C BUS</text>


                <!-- ========================================== -->
                <!-- OPTICAL ISOLATION (PC817)                  -->
                <!-- ========================================== -->
                
                <line x1="300" y1="335" x2="380" y2="335" class="wire" marker-end="url(#arrow)" />

                <rect x="380" y="300" width="250" height="130" class="component-box" />
                <rect x="380" y="300" width="250" height="30" fill="#1a1a1a" />
                <text x="505" y="321" text-anchor="middle" font-weight="bold" fill="#ffffff">PC817 OPTO-ISOLATOR</text>
                
                <line x1="410" y1="365" x2="440" y2="365" class="wire" />
                <polygon points="440,350 440,380 455,365" fill="#000" />
                <line x1="455" y1="350" x2="455" y2="380" stroke="#000" stroke-width="2" />
                
                <line x1="465" y1="360" x2="540" y2="360" class="opto-beam" />
                <line x1="465" y1="370" x2="540" y2="370" class="opto-beam" />

                <line x1="560" y1="345" x2="560" y2="385" stroke="#000" stroke-width="4" />
                <polyline points="560,355 580,335 580,330" class="wire" />
                <polyline points="560,375 580,395 580,400" class="wire" />


                <!-- ========================================== -->
                <!-- ACTUATION SIDE COMPONENTS                  -->
                <!-- ========================================== -->
                
                <line x1="630" y1="365" x2="680" y2="365" class="wire" />

                <rect x="680" y="310" width="130" height="110" class="component-box" />
                <text x="745" y="335" text-anchor="middle" font-weight="bold">RELAY MODULE</text>
                <circle cx="705" cy="385" r="5" fill="#000" />
                <line x1="710" y1="385" x2="760" y2="360" class="wire" />
                
                <circle cx="880" cy="365" r="45" class="component-box" />
                <text x="880" y="370" text-anchor="middle" font-weight="bold">12V PUMP</text>
                <text x="880" y="425" text-anchor="middle" font-size="10">(Inductive Load)</text>

                <rect x="815" y="270" width="35" height="190" fill="none" stroke="#000" stroke-dasharray="3 3" />
                <g transform="translate(842, 365) rotate(-90)">
                    <line x1="-25" y1="0" x2="25" y2="0" class="wire" />
                    <polygon points="5,-12 5,12 18,0" fill="#000" />
                    <line x1="18" y1="-12" x2="18" y2="12" stroke="#000" stroke-width="3" />
                </g>
                <text x="832" y="260" text-anchor="middle" font-weight="bold" font-size="11">1N5819 SCHOTTKY</text>
                <text x="832" y="475" text-anchor="middle" font-size="10" font-style="italic">Spike Suppression</text>

                <polyline points="770,365 830,365 835,365" class="wire" />
                <polyline points="925,365 960,365 960,600 680,600" class="wire" />


                <!-- ========================================== -->
                <!-- GROUND SYSTEMS                             -->
                <!-- ========================================== -->
                
                <g transform="translate(200, 570)">
                    <line x1="0" y1="0" x2="0" y2="20" class="ground-symbol" />
                    <line x1="-15" y1="20" x2="15" y2="20" class="ground-symbol" />
                    <line x1="-10" y1="25" x2="10" y2="25" class="ground-symbol" />
                    <line x1="-5" y1="30" x2="5" y2="30" class="ground-symbol" />
                    <text x="25" y="28" font-size="11" font-weight="bold">GND (5V)</text>
                </g>

                <g transform="translate(680, 600)">
                    <line x1="0" y1="0" x2="0" y2="20" class="ground-symbol" />
                    <line x1="-15" y1="20" x2="15" y2="20" class="ground-symbol" />
                    <line x1="-10" y1="25" x2="10" y2="25" class="ground-symbol" />
                    <line x1="-5" y1="30" x2="5" y2="30" class="ground-symbol" />
                    <text x="25" y="28" font-size="11" font-weight="bold">GND (12V)</text>
                </g>


                <!-- ========================================== -->
                <!-- MATHEMATICAL VALIDATION BOX                -->
                <!-- ========================================== -->
                <!-- Moved significantly lower to y=700 to provide breathing room -->
                <rect x="580" y="700" width="400" height="70" fill="#1a1a1a" />
                <text x="780" y="728" text-anchor="middle" fill="#ffffff" font-weight="bold" font-size="15">V_spike = -L * (di/dt)</text>
                <text x="780" y="755" text-anchor="middle" fill="#ffffff" font-size="11">Lenz's Law Mitigation via Schottky Flyback Snubbing</text>

            </svg>
        </div>
    </div>

</body>
</html>
