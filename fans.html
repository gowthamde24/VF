<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ventilation Fan Array Schematic</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Courier+Prime:ital,wght@0,400;0,700;1,400&family=Inter:wght@400;600;700&display=swap');

        body {
            background-color: #e5e7eb;
            font-family: 'Inter', sans-serif;
            color: #000000;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 1rem;
        }
        
        .paper {
            background-color: #ffffff;
            border: 1px solid #d1d5db;
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1), 0 4px 6px -2px rgba(0, 0, 0, 0.05);
            padding: 2rem;
            width: 100%;
            max-width: 800px;
        }

        /* Custom SVG styling */
        svg text {
            font-family: 'Courier Prime', monospace;
            font-size: 14px;
            fill: #000000;
        }

        .airflow-line {
            fill: none;
            stroke: #1f2937;
            stroke-width: 3;
            stroke-dasharray: 12 6;
            stroke-linecap: round;
        }
        
        .airflow-line-solid {
            fill: none;
            stroke: #000000;
            stroke-width: 4;
            stroke-linecap: round;
        }

        .heat-wave {
            fill: none;
            stroke: #4b5563;
            stroke-width: 2;
            stroke-linecap: round;
        }

        .enclosure-boundary {
            fill: #f8fafc;
            stroke: #000000;
            stroke-width: 3;
            stroke-dasharray: 15 5;
        }

        .text-bg {
            fill: #ffffff;
            stroke: none;
        }
    </style>
</head>
<body>

    <div class="paper">
        <!-- Schematic Diagram -->
        <div class="w-full overflow-hidden bg-white border-2 border-black p-2">
            <svg viewBox="0 0 800 650" class="w-full h-auto bg-[#ffffff]">
                
                <!-- Grid Background -->
                <defs>
                    <pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse">
                        <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#f1f5f9" stroke-width="1"/>
                    </pattern>
                    <marker id="arrowhead-flow" markerWidth="10" markerHeight="7" refX="8" refY="3.5" orient="auto">
                        <polygon points="0 0, 10 3.5, 0 7" fill="#1f2937" />
                    </marker>
                    <marker id="arrowhead-solid" markerWidth="10" markerHeight="7" refX="8" refY="3.5" orient="auto">
                        <polygon points="0 0, 10 3.5, 0 7" fill="#000000" />
                    </marker>
                </defs>
                <rect x="0" y="0" width="800" height="650" fill="url(#grid)" />


                <!-- ========================================== -->
                <!-- PHYSICAL ENCLOSURE                         -->
                <!-- ========================================== -->
                
                <!-- Main Plant Canopy Boundary -->
                <rect x="150" y="100" width="500" height="420" class="enclosure-boundary" />
                
                <!-- Top Label -->
                <rect x="170" y="85" width="460" height="30" class="text-bg" />
                <rect x="170" y="85" width="460" height="30" fill="none" stroke="#000" stroke-width="2" />
                <text x="400" y="105" text-anchor="middle" font-weight="bold">INTERNAL PLANT CANOPY (T_internal)</text>


                <!-- ========================================== -->
                <!-- HEAT SOURCES                               -->
                <!-- ========================================== -->

                <!-- LED Grow Lights -->
                <rect x="300" y="150" width="200" height="30" fill="#1f2937" rx="4" />
                <rect x="310" y="175" width="10" height="10" fill="#e5e7eb" opacity="0.5" />
                <rect x="340" y="175" width="10" height="10" fill="#e5e7eb" opacity="0.5" />
                <rect x="370" y="175" width="10" height="10" fill="#e5e7eb" opacity="0.5" />
                <rect x="400" y="175" width="10" height="10" fill="#e5e7eb" opacity="0.5" />
                <rect x="430" y="175" width="10" height="10" fill="#e5e7eb" opacity="0.5" />
                <rect x="460" y="175" width="10" height="10" fill="#e5e7eb" opacity="0.5" />
                
                <rect x="300" y="125" width="200" height="20" class="text-bg" />
                <text x="400" y="140" text-anchor="middle" font-weight="bold">High-Intensity LED Array</text>
                
                <!-- LED Heat Waves -->
                <path d="M 320 190 Q 310 205, 320 220" class="heat-wave" />
                <path d="M 400 190 Q 390 205, 400 220" class="heat-wave" />
                <path d="M 480 190 Q 470 205, 480 220" class="heat-wave" />


                <!-- ========================================== -->
                <!-- FANS (Straight Line Alignment)             -->
                <!-- ========================================== -->

                <!-- FAN 1: INTAKE -->
                <g transform="translate(100, 260)">
                    <rect x="0" y="0" width="50" height="120" fill="#334155" stroke="#000" stroke-width="2" />
                    <!-- Grill -->
                    <line x1="12" y1="0" x2="12" y2="120" stroke="#9ca3af" stroke-width="1.5" />
                    <line x1="25" y1="0" x2="25" y2="120" stroke="#9ca3af" stroke-width="1.5" />
                    <line x1="38" y1="0" x2="38" y2="120" stroke="#9ca3af" stroke-width="1.5" />
                    
                    <!-- Ambient Label -->
                    <text x="-15" y="45" text-anchor="end" font-weight="bold">AMBIENT</text>
                    <text x="-15" y="65" text-anchor="end">(T_ambient)</text>
                    
                    <!-- Intake Arrows -->
                    <path d="M -70 40 L -10 40" class="airflow-line-solid" marker-end="url(#arrowhead-solid)" />
                    <path d="M -70 80 L -10 80" class="airflow-line-solid" marker-end="url(#arrowhead-solid)" />
                    
                    <text x="25" y="140" text-anchor="middle" font-weight="bold">INTAKE FAN</text>
                    <text x="25" y="158" text-anchor="middle" font-size="12">Active Push</text>
                </g>

                <!-- FAN 2: EXHAUST -->
                <g transform="translate(650, 260)">
                    <rect x="0" y="0" width="50" height="120" fill="#334155" stroke="#000" stroke-width="2" />
                    <line x1="12" y1="0" x2="12" y2="120" stroke="#9ca3af" stroke-width="1.5" />
                    <line x1="25" y1="0" x2="25" y2="120" stroke="#9ca3af" stroke-width="1.5" />
                    <line x1="38" y1="0" x2="38" y2="120" stroke="#9ca3af" stroke-width="1.5" />
                    
                    <!-- Exhaust Label -->
                    <text x="65" y="45" text-anchor="start" font-weight="bold">EXHAUST</text>
                    <text x="65" y="65" text-anchor="start">(T_ambient)</text>
                    
                    <!-- Exhaust Arrows -->
                    <path d="M 60 40 L 120 40" class="airflow-line-solid" marker-end="url(#arrowhead-solid)" />
                    <path d="M 60 80 L 120 80" class="airflow-line-solid" marker-end="url(#arrowhead-solid)" />
                    
                    <text x="25" y="140" text-anchor="middle" font-weight="bold">EXHAUST FAN</text>
                    <text x="25" y="158" text-anchor="middle" font-size="12">Active Pull</text>
                </g>

                <!-- Straight-Line Internal Airflow -->
                <path d="M 155 300 L 645 300" class="airflow-line" marker-end="url(#arrowhead-flow)" />
                <path d="M 155 330 L 645 330" class="airflow-line" marker-end="url(#arrowhead-flow)" />
                <path d="M 155 360 L 645 360" class="airflow-line" marker-end="url(#arrowhead-flow)" />
                
                <!-- Cross-Ventilation Label -->
                <rect x="325" y="410" width="150" height="30" class="text-bg" stroke="#000" stroke-width="1" />
                <text x="400" y="430" text-anchor="middle" font-weight="bold">Cross-Ventilation</text>


                <!-- ========================================== -->
                <!-- BIOLOGICAL ASSET                           -->
                <!-- ========================================== -->
                
                <g transform="translate(200, 520)">
                    <!-- Wavy plants -->
                    <path d="M 0 0 Q 30 -40, 60 0 T 120 0 T 180 0 T 240 0 T 300 0 T 360 0 T 400 0" fill="none" stroke="#000" stroke-width="2.5" />
                    <path d="M 20 0 Q 50 -25, 80 0 T 140 0 T 200 0 T 260 0 T 320 0 T 380 0" fill="none" stroke="#64748b" stroke-width="1.5" />
                    
                    <!-- Base -->
                    <rect x="0" y="0" width="400" height="25" fill="#cbd5e1" stroke="#000" stroke-width="2" />
                    
                    <rect x="80" y="-10" width="240" height="20" class="text-bg" />
                    <text x="200" y="5" text-anchor="middle" font-weight="bold">Biological Asset (Polyculture)</text>
                </g>

            </svg>
        </div>
    </div>

</body>
</html>
